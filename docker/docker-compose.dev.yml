services:
  server:
    build:
      context: ..
      dockerfile: docker/server/Dockerfile.dev
    container_name: ania_server_dev
    image: ania_server:dev
    working_dir: /workspace
    env_file:
      - .env
    volumes:
      - ..:/workspace

  web_admin:
    build:
      context: ..
      dockerfile: docker/admin-website/Dockerfile.dev
    container_name: ania_web_admin_dev
    image: ania_web_admin:dev
    working_dir: /workspace
    volumes:
      - ..:/workspace
      - web_admin_node_modules:/workspace/admin-website/node_modules
      - root_node_modules:/workspace/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_NODE_ENV=development

  web:
    build:
      context: ..
      dockerfile: docker/web/Dockerfile
      target: dev
    image: ania_web:dev
    container_name: ania_web_dev
    working_dir: /workspace
    volumes:
      - ..:/workspace
      - web_node_modules:/workspace/client/node_modules
      - root_node_modules:/workspace/node_modules

volumes:
  web_admin_node_modules:
  web_node_modules:
  root_node_modules:
